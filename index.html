<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Course Registration</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===================== AUTH SCREEN ===================== -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="brand">
        <span class="brand-mark">§</span>
        <span class="brand-name">Coursework</span>
      </div>

      <h1 id="auth-heading">Sign in to register for courses</h1>

      <form id="auth-form" class="auth-form">
        <label for="name-field" id="name-field-wrap" class="field hidden">
          <span>Full name</span>
          <input type="text" id="name-field" placeholder="Ananya Rao" autocomplete="name" />
        </label>

        <label for="email-field" class="field">
          <span>Email</span>
          <input type="email" id="email-field" placeholder="you@university.edu" autocomplete="email" required />
        </label>

        <label for="password-field" class="field">
          <span>Password</span>
          <input type="password" id="password-field" placeholder="••••••••" autocomplete="current-password" required minlength="6" />
        </label>

        <p id="auth-error" class="auth-error hidden"></p>

        <button type="submit" id="auth-submit" class="btn btn-primary btn-full">Sign in</button>
      </form>

      <p class="auth-toggle">
        <span id="auth-toggle-text">New here?</span>
        <button type="button" id="auth-toggle-btn">Create an account</button>
      </p>
    </div>
  </div>

  <!-- ===================== APP SHELL ===================== -->
  <div id="app-shell" class="app-shell hidden">

    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">§</span>
        <span class="brand-name">Coursework</span>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="catalogue">Course catalogue</button>
        <button class="nav-item" data-view="mine">My registrations</button>
      </nav>

      <div class="sidebar-foot">
        <div class="who">
          <div class="who-name" id="who-name">—</div>
          <div class="who-email" id="who-email">—</div>
        </div>
        <button id="sign-out" class="btn btn-ghost btn-full">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="view-title">Course catalogue</h1>
        <p id="view-subtitle" class="view-subtitle">Browse open courses and register for the term.</p>
      </header>

      <div id="toast" class="toast hidden"></div>

      <!-- Catalogue view -->
      <section id="view-catalogue" class="view">
        <div id="catalogue-list" class="course-grid"></div>
        <p id="catalogue-empty" class="empty hidden">No courses are open for registration right now.</p>
      </section>

      <!-- My registrations view -->
      <section id="view-mine" class="view hidden">
        <table class="reg-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Course</th>
              <th>Instructor</th>
              <th>Credits</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="mine-list"></tbody>
        </table>
        <p id="mine-empty" class="empty hidden">You haven't registered for any courses yet.</p>
        <p id="mine-credits" class="credits-total hidden"></p>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
